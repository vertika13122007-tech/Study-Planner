<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styling.css">
    <title>Study Planner</title>
</head>
<body>
    <div class="header">
        <h1 id="heading">Study Planner</h1>
        <h4 id="desc">Plan and Organize your study tasks</h4>
    </div>

    <div class="box" id="addition_box">
        <input id="add" placeholder="Add a new task...">
        <button id="button">Add Task</button>
    </div>

    <div class="categories">
        <div class="Assigment design"><p>Assignments</p></div>
        <div class="Exam design"><p>Exam</p></div>
        <div class="Personal design"><p>Personal</p></div>
    </div>

    <div class="task_list"></div>
    
    <div class="footer">
        <div class="progress_card">
            <div id="progress_text">Progress : 0%</div>
            <div class="bar" id="progress-bar"></div>
        </div>
    </div>
</body>
<script src="jscode.js"></script>

</html>
